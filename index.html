<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a91f24">
  <meta name="description" content="旅遊手帖－多人共享、多國旅程與旅伴分帳的旅行規劃 App">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="旅遊手帖">
  <title>旅遊手帖 · Travel Handbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Gochi+Hand&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="paper-noise" aria-hidden="true"></div>
  <div class="floating-doodles" aria-hidden="true">
    <span>✦</span><span>✿</span><span>⌁</span><span>✧</span>
  </div>

  <main id="app" class="app" aria-live="polite"></main>

  <nav id="trip-nav" class="trip-nav" aria-label="旅程功能" hidden>
    <button type="button" data-tab="overview"><span>⌂</span>總覽</button>
    <button type="button" data-tab="itinerary"><span>◷</span>行程</button>
    <button type="button" data-tab="bookings"><span>▰</span>預訂</button>
    <button type="button" data-tab="expenses"><span>＄</span>記帳</button>
    <button type="button" data-tab="more"><span>•••</span>更多</button>
  </nav>

  <dialog id="trip-dialog" class="sheet-dialog">
    <form id="trip-form" method="dialog">
      <input name="id" type="hidden">
      <header class="dialog-head">
        <div><span class="eyebrow">NEW JOURNEY</span><h2 id="trip-dialog-title">建立新旅程</h2></div>
        <button class="close-btn" type="button" data-close-dialog aria-label="關閉">×</button>
      </header>
      <div class="dialog-body form-grid">
        <label class="field full">旅程名稱<input name="title" required placeholder="例如：2027 義大利慢旅行"></label>
        <label class="field full">國家／城市<input name="destinations" required placeholder="例如：義大利・羅馬、佛羅倫斯、威尼斯"></label>
        <label class="field">出發日期<input name="startDate" type="date" required></label>
        <label class="field">回程日期<input name="endDate" type="date" required></label>
        <label class="field">主要幣別<select name="baseCurrency" data-currency-select></select></label>
        <label class="field">當地幣別<select name="localCurrency" data-currency-select></select></label>
        <label class="field full">旅伴姓名<input name="members" placeholder="用逗號分隔，例如：我、小美、Gary"></label>
        <label class="field full">封面短句<input name="subtitle" placeholder="例如：吃遍南義，慢慢走、好好記"></label>
      </div>
      <footer class="dialog-actions"><button class="primary-btn" value="save">建立旅程</button></footer>
    </form>
  </dialog>

  <dialog id="itinerary-dialog" class="sheet-dialog">
    <form id="itinerary-form" method="dialog">
      <input name="id" type="hidden">
      <header class="dialog-head">
        <div><span class="eyebrow">PLAN THE DAY</span><h2>行程項目</h2></div>
        <button class="close-btn" type="button" data-close-dialog aria-label="關閉">×</button>
      </header>
      <div class="dialog-body form-grid">
        <label class="field">日期<input name="date" type="date" required></label>
        <label class="field">時間<input name="time" type="time"></label>
        <label class="field">類型<select name="type"><option value="spot">景點</option><option value="food">餐飲</option><option value="transport">交通</option><option value="hotel">住宿</option><option value="activity">活動</option><option value="other">其他</option></select></label>
        <label class="field">城市<input name="city" placeholder="城市或地區"></label>
        <label class="field full">名稱<input name="title" required placeholder="例如：萬神殿散步"></label>
        <label class="field full">備註<textarea name="note" rows="3" placeholder="營業時間、集合地點或提醒"></textarea></label>
        <label class="field full">地圖連結<input name="mapUrl" type="url" placeholder="https://maps.app.goo.gl/..."></label>
      </div>
      <footer class="dialog-actions split-actions"><button class="danger-link" type="button" data-delete-record="itinerary">刪除</button><button class="primary-btn" value="save">儲存</button></footer>
    </form>
  </dialog>

  <dialog id="booking-dialog" class="sheet-dialog">
    <form id="booking-form" method="dialog">
      <input name="id" type="hidden">
      <header class="dialog-head">
        <div><span class="eyebrow">RESERVATIONS</span><h2>預訂資料</h2></div>
        <button class="close-btn" type="button" data-close-dialog aria-label="關閉">×</button>
      </header>
      <div class="dialog-body form-grid">
        <label class="field">類型<select name="type"><option value="flight">航班</option><option value="hotel">住宿</option><option value="train">火車／巴士</option><option value="car">租車</option><option value="ticket">門票／活動</option><option value="restaurant">餐廳</option><option value="insurance">保險</option><option value="other">其他</option></select></label>
        <label class="field">日期<input name="date" type="date"></label>
        <label class="field full">名稱<input name="title" required placeholder="例如：長榮航空 BR87"></label>
        <label class="field">時間<input name="time" type="time"></label>
        <label class="field">地點<input name="location" placeholder="機場、車站或飯店"></label>
        <label class="field full">訂位代碼<input name="code" placeholder="只在需要時填寫"></label>
        <label class="field full">備註<textarea name="note" rows="3"></textarea></label>
        <label class="field full">雲端檔案連結<input name="url" type="url" placeholder="Google Drive、iCloud 或票券連結"></label>
      </div>
      <footer class="dialog-actions split-actions"><button class="danger-link" type="button" data-delete-record="booking">刪除</button><button class="primary-btn" value="save">儲存</button></footer>
    </form>
  </dialog>

  <dialog id="flight-dialog" class="sheet-dialog">
    <form id="flight-form" method="dialog">
      <header class="dialog-head">
        <div><span class="eyebrow">FLIGHT DETAILS</span><h2>航班資訊</h2></div>
        <button class="close-btn" type="button" data-close-dialog aria-label="關閉">×</button>
      </header>
      <div class="dialog-body form-grid">
        <label class="field">出發日期<input name="outboundDate" type="date" required></label>
        <label class="field">去程航班<input name="outboundFlight" placeholder="例如：中華航空 CI190"></label>
        <label class="field">回程日期<input name="returnDate" type="date" required></label>
        <label class="field">回程航班<input name="returnFlight" placeholder="例如：中華航空 CI189"></label>
        <label class="field full">機票雲端連結<input name="ticketUrl" type="url" placeholder="Google Drive、iCloud 或航空公司電子機票連結"></label>
      </div>
      <footer class="dialog-actions"><button class="primary-btn" value="save">儲存航班資訊</button></footer>
    </form>
  </dialog>

  <dialog id="passport-dialog" class="sheet-dialog small-dialog">
    <form id="passport-form" method="dialog">
      <header class="dialog-head">
        <div><span class="eyebrow">TRAVEL DOCUMENT</span><h2>護照資料</h2></div>
        <button class="close-btn" type="button" data-close-dialog aria-label="關閉">×</button>
      </header>
      <div class="dialog-body">
        <p class="dialog-note">護照屬於敏感資料，請使用需要登入、且只開放給自己的雲端連結，不要設定為公開存取。</p>
        <label class="field">護照雲端連結<input name="passportUrl" type="url" placeholder="Google Drive 或 iCloud 檔案連結"></label>
      </div>
      <footer class="dialog-actions"><button class="primary-btn" value="save">儲存護照連結</button></footer>
    </form>
  </dialog>

  <dialog id="expense-dialog" class="sheet-dialog">
    <form id="expense-form" method="dialog">
      <input name="id" type="hidden">
      <header class="dialog-head">
        <div><span class="eyebrow">SPLIT THE BILL</span><h2>新增共同花費</h2></div>
        <button class="close-btn" type="button" data-close-dialog aria-label="關閉">×</button>
      </header>
      <div class="dialog-body form-grid">
        <label class="field full">項目<input name="title" required placeholder="例如：機場到飯店計程車"></label>
        <label class="field">日期<input name="date" type="date" required></label>
        <label class="field">類別<select name="category"><option>餐飲</option><option>交通</option><option>住宿</option><option>購物</option><option>門票</option><option>其他</option></select></label>
        <label class="field">金額<input name="amount" type="number" min="0" step="0.01" required></label>
        <label class="field">幣別<select name="currency" data-currency-select></select></label>
        <label class="field full">換算匯率 <small>1 當地幣＝多少主要幣別</small><input name="exchangeRate" type="number" min="0.000001" step="0.000001" value="1" required></label>
        <label class="field full">付款人<select name="payerId" required></select></label>
        <fieldset class="field full check-field"><legend>一起分帳的人</legend><div id="expense-participants" class="choice-grid"></div></fieldset>
        <fieldset class="field full check-field"><legend>分攤方式</legend><div class="segmented"><label><input type="radio" name="splitMode" value="equal" checked><span>平均分攤</span></label><label><input type="radio" name="splitMode" value="custom"><span>自訂金額</span></label></div></fieldset>
        <div id="custom-splits" class="custom-splits full" hidden></div>
        <label class="field full">備註<textarea name="note" rows="2"></textarea></label>
      </div>
      <footer class="dialog-actions split-actions"><button class="danger-link" type="button" data-delete-record="expense">刪除</button><button class="primary-btn" value="save">儲存並計算</button></footer>
    </form>
  </dialog>

  <dialog id="list-dialog" class="sheet-dialog small-dialog">
    <form id="list-form" method="dialog">
      <header class="dialog-head"><div><span class="eyebrow">CHECKLIST</span><h2>新增清單項目</h2></div><button class="close-btn" type="button" data-close-dialog>×</button></header>
      <div class="dialog-body form-grid">
        <label class="field">清單<select name="type"><option value="todo">待辦事項</option><option value="packing">行李清單</option><option value="shopping">購物清單</option></select></label>
        <label class="field">負責人<select name="assigneeId"></select></label>
        <label class="field full">項目<input name="title" required placeholder="例如：申請國際駕照"></label>
      </div>
      <footer class="dialog-actions"><button class="primary-btn" value="save">加入清單</button></footer>
    </form>
  </dialog>

  <dialog id="member-dialog" class="sheet-dialog small-dialog">
    <form id="member-form" method="dialog">
      <header class="dialog-head"><div><span class="eyebrow">TRAVEL CREW</span><h2>新增旅伴</h2></div><button class="close-btn" type="button" data-close-dialog>×</button></header>
      <div class="dialog-body"><label class="field">旅伴姓名<input name="name" required placeholder="輸入姓名或暱稱"></label></div>
      <footer class="dialog-actions"><button class="primary-btn" value="save">加入旅伴</button></footer>
    </form>
  </dialog>

  <dialog id="sync-dialog" class="sheet-dialog small-dialog">
    <form id="sync-form" method="dialog">
      <input name="mode" type="hidden" value="upload">
      <header class="dialog-head"><div><span class="eyebrow">CLOUD TRIP</span><h2 id="sync-dialog-title">雲端共享</h2></div><button class="close-btn" type="button" data-close-dialog>×</button></header>
      <div class="dialog-body">
        <p class="dialog-note" id="sync-dialog-note">建立共享代碼後，把網址與代碼傳給旅伴即可一起編輯。</p>
        <label class="field">行程代碼<input name="code" minlength="6" maxlength="50" pattern="[a-z0-9-]+" required autocapitalize="none" placeholder="例如：italy-slow-trip-27"></label>
      </div>
      <footer class="dialog-actions"><button class="primary-btn" value="save">連線雲端</button></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
